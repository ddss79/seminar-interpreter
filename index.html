<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Interpreter">
<meta name="theme-color" content="#0b0d10">
<!-- iPad: "Add to Home Screen" opens it full screen, with this icon -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Seminar Interpreter</title>
<!-- BIZ UDPGothic: Morisawa universal-design font, very legible Japanese on screens (also on iPad, via Google Fonts) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<script>/* apply the saved theme before the page is drawn (no flash) */ try { document.documentElement.dataset.theme = localStorage.getItem("si_theme") || "dark"; } catch(e) {}
/* Device detection: iphone / ipad / other. iPadOS reports itself as a Mac, so a Mac with a touch screen = iPad.
   For testing on a PC, add ?device=iphone or ?device=ipad to the address. */
(function(){
  const ua = navigator.userAgent, forced = (location.search.match(/[?&]device=(iphone|ipad|other)\b/) || [])[1];
  const dev = forced || (/iPhone|iPod/.test(ua) ? "iphone" : (/iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) ? "ipad" : "other");
  document.documentElement.dataset.device = dev;
})();</script>
<style id="themevars">
  /* Colour themes. Copied as-is into the Left / Right / Troubleshooting windows, so all windows share them. */
  :root { color-scheme:dark;
    --hist-last:#c4c8cf; --bg:#0b0d10; --fg:#f5f5f0; --dim:#8a8f98; --accent:#ffd34d; --prov:#b9bdc4; --src:#6f7680; --strong:#fff;
    --panel:#1a1d22; --menu:#23272e; --ctl:#cfd3da; --hint:#7d838c; --in-bg:#0f1114; --in-fg:#eee; --border:#3a3f47;
    --btn:#2e333b; --btn-fg:#fff; --line:#2a2e35; --meter:#333; --float:rgba(46,51,59,.9); --zebra:#12151a; --ok:#6fbf73;
    --n-fg:#f0f0f0; --n-ja:#d0d3d8; --n-err:#4a1714; --n-warn:#3d3210; --n-info:#14283d; }
  :root[data-theme="light"] { color-scheme:light;
    --hist-last:#3a3f47; --bg:#fafaf7; --fg:#15171a; --dim:#5f6670; --accent:#e0a800; --prov:#6b7280; --src:#7a818c; --strong:#000;
    --panel:#e8eaed; --menu:#fff; --ctl:#2a2e35; --hint:#5f6670; --in-bg:#fff; --in-fg:#15171a; --border:#b8bec7;
    --btn:#d3d7dd; --btn-fg:#15171a; --line:#d3d7dd; --meter:#c8ccd2; --float:rgba(211,215,221,.95); --zebra:#f0f1f3; --ok:#2e7d32;
    --n-fg:#15171a; --n-ja:#3a3f47; --n-err:#fde8e7; --n-warn:#fff4d6; --n-info:#e3effb; }
</style>
<style>
  /* --bottom: free space under the subtitles (also used by the Left/Right windows) */
  :root { --bottom: calc(4vh + env(safe-area-inset-bottom)); --fs: 56px; }
  * { box-sizing: border-box; }
  html,body { margin:0; height:100%; height:100dvh; overflow:hidden; background:var(--bg); color:var(--fg);
    font-family: "Segoe UI", "Helvetica Neue", Arial, "BIZ UDPGothic", "Meiryo", "Hiragino Sans", "Noto Sans JP", sans-serif; }
  #controls { padding:calc(12px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 12px calc(16px + env(safe-area-inset-left));
    background:var(--panel); font-size:14px; line-height:1.4; }
  .row { display:flex; flex-wrap:wrap; gap:12px 14px; align-items:center; }
  .row + .row { margin-top:12px; }
  #controls label { display:flex; align-items:center; gap:6px; color:var(--ctl); }
  #controls input[type=password]{ width:200px; }
  select, input, textarea { background:var(--in-bg); color:var(--in-fg); border:1px solid var(--border); border-radius:4px; padding:4px 6px; }
  button { padding:7px 14px; font-size:14px; border:0; border-radius:6px; cursor:pointer; background:var(--btn); color:var(--btn-fg); }
  button.primary { background:#2f7d32; color:#fff; } button.stop { background:#b3261e; color:#fff; }
  button:disabled { opacity:.5; cursor:default; }
  .sep { width:1px; height:22px; background:var(--border); }
  #status { display:flex; align-items:center; gap:8px; color:var(--ctl); }
  #dot { width:12px; height:12px; border-radius:50%; background:#666; }
  #meter { width:80px; height:8px; background:var(--meter); border-radius:4px; overflow:hidden; }
  #meter > div { height:100%; width:0; background:#4caf50; }
  details { color:var(--ctl); } summary { cursor:pointer; }
  #glossary { width:100%; height:90px; margin-top:6px; font-family:monospace; }
  .hint { color:var(--hint); font-size:12px; }
  #stage { position:absolute; top:var(--top,60px); left:0; right:0; bottom:0;
    display:flex; flex-direction:column; justify-content:flex-end; padding:3vh 5vw var(--bottom); overflow:hidden; }
  #history p { margin:0 0 .5em; color:var(--dim); font-size:calc(var(--fs)*.6); line-height:1.25; }
  /* History: shows the last "History lines" entries; scroll up (swipe) to read older ones.
     While the reader is scrolled up, auto-scroll pauses, the box grows to the free space and a "Live" button appears. */
  .hwrap { position:relative; display:flex; flex-direction:column; flex:0 1 auto; min-height:0; }
  .hwrap.paused { flex:1 1 0; }
  .hbox { flex:0 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
    scrollbar-width:thin; scrollbar-color:var(--border) transparent; }
  .hwrap.paused .hbox { flex:1 1 0; }
  button.live { position:absolute; right:10px; bottom:10px; z-index:5; background:var(--accent); color:#000; font-weight:600;
    box-shadow:0 4px 14px rgba(0,0,0,.35); }
  button.live[hidden] { display:none; }
  /* The big line has a fixed height (3 lines) so it never grows or shrinks; text sits at the bottom.
     If a text does not fit, its oldest part moves to the history (see fitMain / pRender). */
  #current, .col .cur { display:flex; flex-direction:column; justify-content:flex-end; overflow:hidden; flex:none; }
  #current { font-size:var(--fs); line-height:1.25; font-weight:600; height:calc(1.25em * 3);
    border-left:6px solid var(--accent); padding-left:.5em; }
  #history p:last-child, .col .hist p:last-child { font-weight:600; color:var(--hist-last); }   /* most recent line */
  #current .prov { color:var(--prov); font-weight:400; }
  #source { margin-top:.6em; font-size:calc(var(--fs)*.38); color:var(--src); min-height:1.3em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; direction:rtl; text-align:left; }
  #source span { direction:ltr; unicode-bidi:bidi-override; }
  /* in the normal flow (not floating), so the history can never slide under it */
  #label { flex:none; margin:0 0 auto; padding-bottom:8px; font-size:14px; letter-spacing:.15em; color:var(--dim); }
  body.full #controls, body.hidemenu #controls { display:none; } body.full, body.hidemenu { --top:env(safe-area-inset-top); }
  #exitfs, #showmenu { position:fixed; z-index:20; top:calc(12px + env(safe-area-inset-top)); right:calc(14px + env(safe-area-inset-right));
    display:none; opacity:.35; transition:opacity .3s; background:var(--float); color:var(--btn-fg); font-size:15px; }
  body.full #exitfs, body.hidemenu:not(.full) #showmenu { display:block; }
  body.showexit #exitfs, body.showexit #showmenu, #exitfs:hover, #showmenu:hover { opacity:1; }
  #split { position:absolute; top:var(--top,60px); left:0; right:0; bottom:0; display:none;
    grid-template-columns:1fr 1fr; gap:0; }
  body.split #stage, body.split #label { display:none; } body.split #split { display:grid; }
  body.split #showjaLbl { display:none !important; }   /* the left column already shows the source language */
  .col { display:flex; flex-direction:column; justify-content:flex-end; padding:3vh 3vw var(--bottom); overflow:hidden; }
  .col + .col { border-left:2px solid var(--line); }
  .col h3 { margin:0 0 auto; font-size:14px; letter-spacing:.15em; color:var(--dim); font-weight:400; }
  .col .hist p { margin:0 0 .5em; color:var(--dim); font-size:calc(var(--fs)*.45); line-height:1.3; }
  .col .cur { font-size:calc(var(--fs)*.72); line-height:1.3; font-weight:600; height:calc(1.3em * 3);
    border-left:5px solid var(--accent); padding-left:.5em; }
  .col .cur .prov { color:var(--prov); font-weight:400; }
  .notice { margin-top:8px; padding:8px 10px; border-radius:6px; font-size:14px; color:var(--n-fg); }
  .notice.err { background:var(--n-err); border-left:4px solid #e53935; }
  .notice.warn { background:var(--n-warn); border-left:4px solid #f0b400; }
  .notice.info { background:var(--n-info); border-left:4px solid #4a90d9; }
  .notice .ja { display:block; margin-top:3px; color:var(--n-ja); }
  .notice .x { float:right; padding:0 8px; background:transparent; color:var(--n-fg); font-size:16px; }
  .notice .act { margin-top:6px; padding:4px 10px; background:#2f5f8f; color:#fff; }
  #helpwrap { position:relative; }
  #helpmenu { position:absolute; z-index:30; top:calc(100% + 4px); left:0; min-width:300px; padding:6px;
    background:var(--menu); border:1px solid var(--border); border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,.35); }
  #helpmenu[hidden] { display:none; }
  #helpmenu button { display:block; width:100%; text-align:left; background:transparent; padding:8px 10px; white-space:nowrap; }
  #helpmenu button:hover, #helpmenu button:focus { background:var(--btn); }
  #helpmenu .copy { margin-top:4px; padding:8px 10px 4px; border-top:1px solid var(--border); color:var(--hint); font-size:12px; }
  #about { background:var(--panel); color:var(--fg); border:1px solid var(--border); border-radius:10px; padding:20px 26px; min-width:320px; font-size:15px; }
  #about::backdrop { background:rgba(0,0,0,.6); }
  #about h2 { margin:0 0 6px; font-size:20px; } #about p { margin:0 0 10px; line-height:1.5; }
  #about .copy { color:var(--dim); font-size:13px; } #about form { text-align:right; margin:0; }
  #row4 { align-items:flex-start; }
  #row4 details[open] { flex:1 1 600px; }
  #row4 summary { padding:6px 0; }

  /* ---------- iPad / touch version ---------- */
  html, body { -webkit-text-size-adjust:100%; touch-action:manipulation; }   /* no double-tap zoom */
  #controls { font-size:16px; }
  select, input, textarea, button { font-size:16px; }   /* under 16px the iPad zooms in when a field is touched */
  button, select { min-height:44px; }                   /* Apple's minimum touch size */
  button { padding:10px 16px; }
  #controls input[type=password], #controls input[type=number] { min-height:40px; }
  #controls input[type=checkbox] { width:22px; height:22px; }
  #controls input[type=range] { width:170px; }
  #helpmenu button { min-height:48px; }
  #exitfs, #showmenu { padding:12px 18px; font-size:17px; }
  /* Not available on iPad: Zoom/system audio capture and separate Left/Right windows */
  #srcLbl, #popL, #popR { display:none !important; }
  #topic { max-width:100%; }

  /* ---------- iPhone (small screen) ---------- */
  #mbar { display:none; }
  :root[data-device="iphone"] { --bottom: calc(4vh + env(safe-area-inset-bottom)); }
  :root[data-device="iphone"] #hidemenu { display:none; }   /* the iPhone already has "⛶ Hide menus" */
  /* Compact bar always visible: ⚙ Settings · Start · Stop · status. The other rows open with ⚙. */
  :root[data-device="iphone"] #mbar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  :root[data-device="iphone"] #mbar #status { margin-left:auto; }
  :root[data-device="iphone"] #mbar #meter { width:50px; }
  :root[data-device="iphone"] #controls > .row { display:none; margin-top:12px; }
  :root[data-device="iphone"] body.showset #controls > .row { display:flex; }
  :root[data-device="iphone"] body.showset #controls { max-height:75vh; max-height:75dvh; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  :root[data-device="iphone"] #controls input[type=password] { width:min(200px, 52vw); }
  :root[data-device="iphone"] #helpmenu { min-width:0; width:max-content; max-width:calc(100vw - 32px); }
  :root[data-device="iphone"] #helpmenu button { white-space:normal; }
  :root[data-device="iphone"] #label { font-size:12px; }
  /* Side by side: one above the other when the iPhone is upright, side by side when it is turned */
  :root[data-device="iphone"] #split { grid-template-columns:1fr; grid-template-rows:1fr 1fr; }
  :root[data-device="iphone"] .col { padding:2vh 4vw var(--bottom); }
  :root[data-device="iphone"] .col + .col { border-left:0; border-top:2px solid var(--line); }
  @media (orientation: landscape) {
    :root[data-device="iphone"] #split { grid-template-columns:1fr 1fr; grid-template-rows:none; }
    :root[data-device="iphone"] .col + .col { border-top:0; border-left:2px solid var(--line); }
  }
</style>
</head>
<body>
<div id="controls">
  <!-- iPhone only: compact bar (Start, Stop and status are moved here by the script) -->
  <div id="mbar"><button id="setbtn" aria-expanded="false">⚙ Settings</button></div>
  <!-- Line 1: provider and key -->
  <div class="row">
    <label>Provider
      <select id="prov">
        <option value="soniox">Soniox (text, ~US$0.18/h)</option>
        <option value="openai">OpenAI Realtime-Translate (~US$2/h)</option>
      </select></label>
    <label>API key <input id="key" type="password" placeholder="paste key here"></label>
    <button id="forget" title="Delete the stored key from this browser">🗑 Forget key</button>
    <div id="helpwrap">
      <button id="helpbtn" aria-haspopup="true" aria-expanded="false">❓ Help ▾</button>
      <div id="helpmenu" role="menu" hidden>
        <button role="menuitem" id="mGuide">📖 Quick guide / クイックガイド</button>
        <button role="menuitem" id="mTrouble">🛠 Troubleshooting / トラブルシューティング</button>
        <button role="menuitem" id="mAbout">ℹ About / このアプリについて</button>
        <div class="copy" id="mCopy"></div>
      </div>
    </div>
  </div>
  <!-- Line 2: audio, languages, start/stop, status -->
  <div class="row">
    <label id="srcLbl">Audio source
      <select id="src">
        <option value="mic">Microphone</option>
      </select></label>
    <label>Microphone <select id="mic"></select></label>
    <label>From <select id="from"></select></label>
    <label>To <select id="to"></select></label>
    <label><input id="two" type="checkbox"> Two-way (Soniox only)</label>
    <button id="start" class="primary">▶ Start</button>
    <button id="stop" class="stop" disabled>■ Stop</button>
  </div>
  <!-- Line 3: display settings -->
  <div class="row">
    <label id="speedLbl" title="How long Soniox waits in a pause before it closes a sentence. Faster = translation appears sooner, but sentences are cut more often at pauses. Applies when you press Start.">Speed
      <select id="speed">
        <option value="800">Fast (0.8 s)</option>
        <option value="1500">Normal (1.5 s)</option>
        <option value="2500">Slow speaker (2.5 s)</option>
      </select></label>
    <label>Font size <input id="size" type="range" min="28" max="110" value="56"></label>
    <label>History lines <input id="hist" type="number" min="0" max="10" value="3" style="width:46px"></label>
    <label id="showjaLbl"><input id="showja" type="checkbox"> Show source language</label>
    <label>Layout <select id="layout"><option value="single">Single (translation only)</option><option value="split">Side by side (From | To)</option></select></label>
    <button id="theme" title="Switch between dark and light colours (all windows)"></button>
  </div>
  <!-- Line 4: windows and export -->
  <div class="row">
    <button id="popL" title="Open the left column (From language) in its own window">⧉ Left window</button>
    <button id="popR" title="Open the right column (To language) in its own window">⧉ Right window</button>
    <button id="hidemenu" title="Hide these menus without going full screen. Show them again with the ▼ Menu button (top right).">▲ Hide menu</button>
    <button id="full">⛶ Full screen</button>
    <button id="export">⬇ Export transcript</button>
    <span class="sep"></span>
    <div id="status" title="Sound level and connection status"><div id="meter"><div></div></div><div id="dot"></div><span id="stxt">Stopped / 停止中</span></div>
  </div>
  <!-- Line 5: glossary -->
  <div class="row" id="row4">
  <details id="gl">
    <summary>Glossary and seminar topic (Soniox only — write: source term = target term)</summary>
    <div class="row" style="margin-top:6px">
      <label>Topic <input id="topic" style="width:420px" placeholder="e.g. Andean archaeology seminar, Formative Period"></label>
    </div>
    <textarea id="glossary" placeholder="One term per line:  source term = target term
形成期 = Formative Period
神殿 = temple
クントゥル・ワシ = Kuntur Wasi"></textarea>
    <div class="hint">Changes take effect when you press Start.</div>
  </details>
  </div>
  <div id="notices"></div>
</div>
<dialog id="about">
  <h2>Seminar Interpreter</h2>
  <p id="aboutVer"></p>
  <p>Live speech translation for seminars (Soniox / OpenAI).<br><span lang="ja">セミナー用リアルタイム音声翻訳</span></p>
  <p class="copy" id="aboutCopy"></p>
  <form method="dialog"><button class="primary">OK</button></form>
</dialog>
<button id="exitfs">✕ Exit full screen / 全画面を終了</button>
<button id="showmenu" title="Show the menus again">▼ Menu / メニュー</button>
<div id="split">
  <div class="col" id="colL"><h3></h3><div class="hwrap"><div class="hist hbox"></div></div><div class="cur"></div></div>
  <div class="col" id="colR"><h3></h3><div class="hwrap"><div class="hist hbox"></div></div><div class="cur"></div></div>
</div>
<div id="stage">
  <div id="label"></div>
  <div class="hwrap"><div id="history" class="hbox"></div></div>
  <div id="current"></div>
  <div id="source"><span></span></div>
</div>

<script>
const $ = id => document.getElementById(id);
const APP_VERSION = "1.4 (iPad/iPhone)";   // change here when releasing a new version
// ---------- device (detected in <head>) ----------
const DEVICE = document.documentElement.dataset.device || "other";
const IPHONE = DEVICE === "iphone";
const DEVICE_NAME = { iphone:"iPhone", ipad:"iPad", other:"computer / コンピューター" }[DEVICE];
if (IPHONE) {
  for (const id of ["start", "stop", "status"]) $("mbar").appendChild($(id));   // always visible, even with Settings closed
  $("size").min = 18;
  $("full").textContent = "⛶ Hide menus";   // the iPhone has no real full screen for web pages; this hides the menus
}
function showSettings(open){
  document.body.classList.toggle("showset", open);
  $("setbtn").setAttribute("aria-expanded", open ? "true" : "false");
  $("setbtn").textContent = open ? "⚙ Settings ▴" : "⚙ Settings";
  applyUI();
}
$("setbtn").onclick = () => showSettings(!document.body.classList.contains("showset"));
const COPYRIGHT = "© 2026 DS-Lab";
// Latin text uses Segoe UI; Japanese characters fall through to BIZ UDPGothic (much clearer than the narrow "Yu Gothic UI").
const FONT_STACK = `"Segoe UI","Helvetica Neue",Arial,"BIZ UDPGothic","Meiryo","Hiragino Sans","Noto Sans JP",sans-serif`;
const FONT_LINK = `<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">`;

// ---------- light / dark theme (main page + Left/Right/Troubleshooting windows, also in full screen) ----------
const THEME_VARS = $("themevars").textContent;   // same colour definitions in every window
let theme = (() => { try { return localStorage.getItem("si_theme") || "dark"; } catch(e) { return "dark"; } })();
let helpWin = null;
function applyTheme(){
  document.documentElement.dataset.theme = theme;
  $("theme").textContent = theme === "dark" ? "☀ Light mode" : "🌙 Dark mode";
  for (const w of [pops.L, pops.R, helpWin]) {
    try { if (w && !w.closed) w.document.documentElement.dataset.theme = theme; } catch(e) {}
  }
}
$("theme").onclick = () => { theme = theme === "dark" ? "light" : "dark"; try { localStorage.setItem("si_theme", theme); } catch(e) {} applyTheme(); };
const CFG = {
  openai: { url:"wss://api.openai.com/v1/realtime/translations?model=gpt-realtime-translate", rate:24000 },
  soniox: { url:"wss://stt-rt.soniox.com/transcribe-websocket", rate:16000, model:"stt-rt-v5" }
};
const SILENCE_MS = 1500, MAX_CHARS = 240;

let SRC = "ja", TGT = "en";
let ws = null, running = false, ctx = null, stream = null, node = null, prov = "soniox";
let buf = new Float32Array(0), current = "", provisional = "", silenceTimer = null;
let history = [], log = [], jaLog = "", jaLine = "", jaProv = "";

// ---------- local preferences ----------
const load = k => { try { return localStorage.getItem(k); } catch(e) { return null; } };
const save = (k,v) => { try { localStorage.setItem(k,v); } catch(e) {} };
$("prov").value = load("si_prov") || "soniox";
// To add a language: add a line here (ISO code: menu name, column title, CJK = written without spaces).
const LANGS = {
  ja: { name:"Japanese",   title:"日本語",     cjk:true  },
  en: { name:"English",    title:"ENGLISH",    cjk:false },
  es: { name:"Spanish",    title:"ESPAÑOL",    cjk:false },
  pt: { name:"Portuguese", title:"PORTUGUÊS",  cjk:false },
  zh: { name:"Chinese",    title:"中文",       cjk:true  },
  ko: { name:"Korean",     title:"한국어",     cjk:false },
};
const cjk = l => !!(LANGS[l] && LANGS[l].cjk);
const UP = l => (LANGS[l] ? LANGS[l].name.toUpperCase() : l);
for (const id of ["from","to"]) $(id).innerHTML = Object.entries(LANGS).map(([k,v]) => `<option value="${k}">${v.name}</option>`).join("");
(function migrate(){ const old = load("si_dir");   // settings from earlier versions
  if (!load("si_from") && old) { const [a,b] = old === "two-way" ? ["ja","en"] : old.split("-"); save("si_from",a); save("si_to",b); save("si_two", old === "two-way" ? "1" : "0"); } })();
$("from").value = load("si_from") || "ja";

$("two").checked = load("si_two") === "1";

const active = {};
// Notices the user closed with ×. They stay hidden until the problem goes away (clearN) or Start is pressed again.
const dismissed = new Set();
function fill(t, v){ return t.replace(/\{(\w+)\}/g, (_,k) => (v && v[k] != null) ? v[k] : ""); }
function notify(id, vars, action){
  if (!MSG[id] || dismissed.has(id)) return;
  const prev = active[id];
  if (prev && JSON.stringify(prev.vars) === JSON.stringify(vars) && !prev.action === !action) return;   // already shown
  active[id] = { vars, action }; renderNotices();
}
function clearN(id){ dismissed.delete(id); if (active[id]) { delete active[id]; renderNotices(); } }
function dismissN(id){ dismissed.add(id); if (active[id]) { delete active[id]; renderNotices(); } }
function clearAllN(except){ dismissed.clear(); for (const k of Object.keys(active)) if (!(except||[]).includes(k)) delete active[k]; renderNotices(); }
function renderNotices(){
  const box = $("notices"); box.innerHTML = "";
  for (const [id, a] of Object.entries(active)) {
    const m = MSG[id], d = document.createElement("div");
    d.className = "notice " + m.lv;
    d.innerHTML = `<button class="x" title="Dismiss">×</button>${esc(fill(m.en,a.vars))}<span class="ja">${esc(fill(m.ja,a.vars))}</span>`;
    d.querySelector(".x").onclick = () => dismissN(id);
    if (a.action) { const b = document.createElement("button"); b.className = "act"; b.textContent = a.action.label; b.onclick = () => { a.action.run(); clearN(id); }; d.appendChild(b); }
    box.appendChild(d);
  }
  // Notices live in the menu area: if it is hidden, bring it back for errors and warnings.
  if (document.body.classList.contains("hidemenu") && Object.keys(active).some(id => MSG[id].lv !== "info")) {
    document.body.classList.remove("hidemenu", "showexit");
  }
  applyUI();
}

  w.document.open();
  w.document.write(`<!DOCTYPE html><html lang="en" data-theme="${theme}"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">

        output:{ language: TGT },
        input:{ transcription:{ model:"gpt-realtime-whisper" }, noise_reduction:{ type:"near_field" } } }}}));
      opened = true; failCount = 0; clearN("cant_connect");
      flushPending();   // audio recorded while (re)connecting
      status("Translating (OpenAI) / 翻訳中", "#4caf50");
    };
    sock.onmessage = e => {
      let ev; try { ev = JSON.parse(e.data); } catch(_) { return; }
      if (ev.type === "session.output_transcript.delta") { onDelta(ev.delta || ""); pAppend(TGT, ev.delta || ""); }
      else if (ev.type === "session.input_transcript.delta") { pAppend(SRC, ev.delta || ""); jaLine += ev.delta || ""; jaLog += ev.delta || ""; jaLine = jaLine.slice(-200); render(); }
      else if (ev.type === "error") handleError(ev.error?.code || ev.error?.type, ev.error?.message);
    };
  } else {
    sock = ws = new WebSocket(CFG.soniox.url);
    sock.binaryType = "arraybuffer";
    sock.onopen = () => {
      const cfg = {
        api_key: key, model: sonioxModel,
        audio_format: "pcm_s16le", sample_rate: CFG.soniox.rate, num_channels: 1,
        language_hints: TWO ? [SRC, TGT] : [SRC], enable_endpoint_detection: true, max_endpoint_delay_ms: +$("speed").value || 1500,
        translation: TWO ? { type:"two_way", language_a:SRC, language_b:TGT } : { type:"one_way", target_language: TGT }
      };
      const c = sonioxContext(); if (c) cfg.context = c;
      sock.send(JSON.stringify(cfg));
      opened = true; failCount = 0; clearN("cant_connect");
      flushPending();   // audio recorded while (re)connecting
      status("Translating (Soniox · " + sonioxModel + ") / 翻訳中", "#4caf50");
    };
    sock.onmessage = e => {
      let r; try { r = JSON.parse(e.data); } catch(_) { return; }
      if (r.error_code) { handleError(r.error_code, r.error_message); return; }
      let provEN = "", provJA = ""; const pp = { [SRC]:"", [TGT]:"" };
      for (const t of (r.tokens || [])) {
        if (t.text === "<end>") { pSoft(SRC); pSoft(TGT); continue; }
        if (!t.text || t.text === "<fin>") continue;
        const lang = t.language || (t.translation_status === "translation" ? TGT : SRC);
        if (t.is_final) pAppend(lang, t.text); else if (lang in pp) pp[lang] += t.text;
        if (t.translation_status === "translation") {
          if (t.is_final) {
            if (TWO && t.language && t.language !== curOut) { if (current.trim()) finalize(); curOut = t.language; }
            onDelta(t.text);
          } else provEN += t.text;
        } else {
          if (t.is_final) { jaLine = (jaLine + t.text).slice(-200); jaLog += t.text; } else provJA += t.text;
        }
      }
      provisional = provEN; jaProv = provJA; if (provisional) touchDone(); render();
      for (const l of [SRC, TGT]) if (panels[l]) { panels[l].prov = pp[l] || ""; if (panels[l].prov) pTouch(l); } pRender();
      if (r.finished) sock.close();   // while running: reconnect (onclose); after Stop: finishStop()
    };
  }
  sock.onclose = ev => {
    if (sock !== ws || !running) return;
    if ([1008, 4001, 4003].includes(ev.code)) { handleError(ev.code, ev.reason || "unauthorized"); return; }
    if (!opened && navigator.onLine) { if (++failCount >= 3) { notify("cant_connect"); stop(); return; } }
    const now = Date.now(); reconnects = reconnects.filter(t => now - t < 300000); reconnects.push(now);
    if (reconnects.length > 3) notify("unstable");
    status("Reconnecting… / 再接続中…", "#f0b400");
    const d = nextDelay; nextDelay = 1000;
    setTimeout(() => { if (running) { clearN("rate"); connect(); } }, d);
  };
}

// ---------- audio ----------
function toPCM16(f32){
  const i16 = new Int16Array(f32.length);
  for (let i=0;i<f32.length;i++){ const s=Math.max(-1,Math.min(1,f32[i])); i16[i]= s<0? s*0x8000 : s*0x7fff; }
  return i16;
}
// Audio chunks (100 ms each) recorded while the connection is not ready; sent as soon as it opens.
let pending = [];
const MAX_PENDING = 100;   // 10 seconds
function sendPCM(pcm){
  if (prov === "openai") ws.send(JSON.stringify({ type:"session.input_audio_buffer.append", audio: b64(pcm) }));
  else ws.send(pcm.buffer);
}
function flushPending(){ while (pending.length && ws && ws.readyState === 1) sendPCM(pending.shift()); }
function b64(i16){
  const bytes = new Uint8Array(i16.buffer); let bin = "";
  for (let i=0;i<bytes.length;i+=0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000));
  return btoa(bin);
}

// ---------- pre-start checks ----------
async function fetchT(url, opts, ms){
  const c = new AbortController(); const t = setTimeout(() => c.abort(), ms || 5000);
  try { return await fetch(url, { ...opts, signal:c.signal }); } finally { clearTimeout(t); }
}
const vnum = id => +((id.match(/v(\d+)/) || [0,0])[1]);
async function preflight(key){
  // Returns false if Start must be cancelled. Network/CORS failures are ignored (best effort).
  try {
    if (prov === "soniox") {
      const r = await fetchT("https://api.soniox.com/v1/models", { headers:{ Authorization:"Bearer " + key } });
      if (r.status === 401 || r.status === 403) { notify("key"); return false; }
      if (!r.ok) return true;
      const j = await r.json(); const list = (j.models || j.data || j || []);
      rtModels = list.map(m => typeof m === "string" ? m : (m.id || m.name || "")).filter(id => /^stt-rt-v\d+$/.test(id)).sort((a,b) => vnum(a) - vnum(b));
      if (!rtModels.length) return true;
      const best = rtModels[rtModels.length-1];
      if (!rtModels.includes(sonioxModel)) { notify("model_switched", { m1:sonioxModel, m2:best }); sonioxModel = best; save("si_soniox_model", best); }
      else if (vnum(best) > vnum(sonioxModel)) notify("model_newer", { m1:sonioxModel, m2:best },
        { label:`Use ${best} / ${best}を使用`, run:() => { sonioxModel = best; save("si_soniox_model", best); } });
    } else {
      const r = await fetchT("https://api.openai.com/v1/models/gpt-realtime-translate", { headers:{ Authorization:"Bearer " + key } });
      if (r.status === 401) { notify("key"); return false; }
      if (r.status === 429) { const j = await r.json().catch(()=>({})); if (classify("", j.error?.code + " " + j.error?.message) === "credit") { notify("credit"); return false; } }
    }
  } catch(e) { /* offline, CORS or timeout: continue, the connection itself will report problems */ }
  return true;
}

// ---------- audio sources ----------
let streams = [];
async function openSources(rate){
  const src = $("src").value; const out = [];
  if (src === "mic" || src === "both") {
    try {
      out.push(await navigator.mediaDevices.getUserMedia({ audio:{
        deviceId: $("mic").value ? { exact:$("mic").value } : undefined,
        echoCancellation: src === "both", noiseSuppression:true, autoGainControl:true }}));
    } catch(e) {
      if (e.name === "NotAllowedError" || e.name === "SecurityError") notify("mic_blocked");
      else if (e.name === "NotFoundError" || e.name === "OverconstrainedError") { notify("mic_missing"); listMics(); }
      else notify("unknown", { msg: e.name + ": " + e.message });
      e.handled = true; throw e;
    }
  }
  if (src === "sys" || src === "both") {
    if (!navigator.mediaDevices.getDisplayMedia) {
      out.forEach(s => s.getTracks().forEach(t => t.stop())); notify("sys_unsupported");
      const e = new Error("getDisplayMedia unsupported"); e.handled = true; throw e;
    }
    let ds;
    try {
      ds = await navigator.mediaDevices.getDisplayMedia({ video:true, systemAudio:"include",
        audio:{ echoCancellation:false, noiseSuppression:false, autoGainControl:false } });
    } catch(e) { out.forEach(s => s.getTracks().forEach(t => t.stop())); notify("sys_cancel"); e.handled = true; throw e; }
    if (!ds.getAudioTracks().length) {
      ds.getTracks().forEach(t => t.stop()); out.forEach(s => s.getTracks().forEach(t => t.stop()));
      notify("sys_noaudio"); const e = new Error("no system audio"); e.handled = true; throw e;
    }
    ds.getVideoTracks().forEach(t => t.enabled = false);   // only the sound is used
    ds.getAudioTracks()[0].addEventListener("ended", () => { if (running) notify("sys_cancel"); });
    out.push(ds);
  }
  if (src === "both") notify("both_echo");
  return out;
}

let rsBuf = new Float32Array(0);
function resample(data, inRate, outRate){
  if (inRate === outRate) return data;
  const all = new Float32Array(rsBuf.length + data.length); all.set(rsBuf); all.set(data, rsBuf.length);
  const ratio = inRate / outRate, n = Math.floor(all.length / ratio), out = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const a = Math.floor(i * ratio), b = Math.min(all.length, Math.floor((i + 1) * ratio));
    let sum = 0; for (let j = a; j < b; j++) sum += all[j]; out[i] = sum / Math.max(1, b - a);
  }
  rsBuf = all.slice(Math.floor(n * ratio));
  return out;
}
// ---------- keep the screen on while translating ----------
// If the iPhone/iPad locks its screen or another app is opened, iOS stops the microphone.
// Screen Wake Lock (iOS 16.4+) keeps the screen on; iOS releases it when the app is hidden, so we ask again on return.
let wakeLock = null;
async function keepAwake(on){
  try {
    if (on) {
      if ("wakeLock" in navigator && !wakeLock) {
        wakeLock = await navigator.wakeLock.request("screen");
        wakeLock.addEventListener("release", () => { wakeLock = null; });
      }
    } else if (wakeLock) { const w = wakeLock; wakeLock = null; await w.release(); }
  } catch(e) { /* not supported or refused: the screen may turn off by itself */ }
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && running) keepAwake(true); });
async function start(){
  finishStop();   // if the previous session is still finishing, end it now
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!ctx || ctx.state === "closed") ctx = new AC();     // created inside the click: required on iPad
  try { ctx.resume(); } catch(e){}
  clearAllN(["model_newer"]);
  const key = $("key").value.trim();
  if (!key) { notify("nokey"); return; }
  prov = $("prov").value;
  setDir(); curOut = TGT;
  if (SRC === TGT) { notify("same_lang"); return; }
  if (prov === "openai" && TWO) { notify("twoway_openai"); return; }
  save("si_key_" + prov, key);
  save("si_topic", $("topic").value); save("si_gloss", $("glossary").value); save("si_srcsel", $("src").value);
  $("start").disabled = true; status("Checking… / 確認中…", "#f0b400");
  if (!navigator.onLine) notify("offline");
  if (!(await preflight(key))) { $("start").disabled = false; status("Stopped / 停止中", "#666"); return; }
  if (IPHONE) showSettings(false);   // give the subtitles the whole screen
  keepAwake(true);
  running = true; $("stop").disabled = false; $("prov").disabled = true; $("from").disabled = $("to").disabled = $("two").disabled = true; $("src").disabled = true; $("speed").disabled = true;
  const rate = CFG[prov].rate, chunk = rate / 10;   // 100 ms
  streams = await openSources(rate);
  const inRate = ctx.sampleRate; rsBuf = new Float32Array(0); buf = new Float32Array(0); pending = [];
  // ScriptProcessor works when the page is opened as a local file (AudioWorklet does not).
  node = ctx.createScriptProcessor(4096, 1, 1);
  const mute = ctx.createGain(); mute.gain.value = 0;
  for (const st of streams) ctx.createMediaStreamSource(st).connect(node);   // sources are summed
  node.connect(mute); mute.connect(ctx.destination);
  startedAt = lastLoud = lastTrans = Date.now();
  node.onaudioprocess = (ev) => { const raw = new Float32Array(ev.inputBuffer.getChannelData(0));
    let peak = 0; for (const v of raw) peak = Math.max(peak, Math.abs(v));
    const data = resample(raw, inRate, rate);
    if (peak > 0.02) lastLoud = Date.now();
    $("meter").firstChild.style.width = Math.min(100, peak*140) + "%";
    const nb = new Float32Array(buf.length + data.length); nb.set(buf); nb.set(data, buf.length); buf = nb;
    while (buf.length >= chunk) {
      const pcm = toPCM16(buf.slice(0, chunk)); buf = buf.slice(chunk);
      if (ws && ws.readyState === 1 && opened) { flushPending(); sendPCM(pcm); }
      else { pending.push(pcm); if (pending.length > MAX_PENDING) pending.shift(); }   // keep the last 10 s while reconnecting
    }
  };
  clearInterval(watchdog);
  watchdog = setInterval(() => {
    if (!running) return;
    const now = Date.now();
    if (now - lastLoud > 10000) notify("silent"); else clearN("silent");
    const live = ws && ws.readyState === 1;
    if (live && now - startedAt > 30000 && now - lastLoud < 5000 && now - lastTrans > 30000) notify("no_trans");
    if (!reconnects.some(t => now - t < 300000)) clearN("unstable");
  }, 2000);
  connect();
}
// After Stop, Soniox still sends the last words it was working on. We wait for them (max 4 s) before closing.
let finishing = null;
function flushDisplay(){
  if (provisional) { current += provisional; provisional = ""; }
  jaProv = "";
  finalize(); for (const l of Object.keys(panels)) { panels[l].cur += panels[l].prov; panels[l].prov = ""; pFinal(l); }
}
function finishStop(){
  if (!finishing) return;
  const f = finishing; finishing = null; clearTimeout(f.timer);
  f.sock.onclose = null; f.sock.onmessage = null;
  try { f.sock.close(); } catch(e){}
  flushDisplay();
  if (!running) status("Stopped / 停止中", "#666");
}
function stop(){
  if (finishing) return;   // already stopping
  running = false; clearInterval(watchdog); keepAwake(false);
  $("start").disabled = false; $("stop").disabled = true; $("prov").disabled = false; $("from").disabled = $("to").disabled = $("two").disabled = false; $("src").disabled = false; $("speed").disabled = false;
  try { streams.forEach(st => st.getTracks().forEach(t => t.stop())); streams = []; } catch(e){}
  try { node && (node.onaudioprocess = null); node && node.disconnect(); ctx && ctx.state !== "closed" && ctx.close(); } catch(e){}
  pending = [];
  clearN("silent"); clearN("no_trans");
  $("meter").firstChild.style.width = "0";
  const sock = ws;
  if (sock && sock.readyState === 1 && opened && prov === "soniox") {
    try { sock.send(""); } catch(e){}   // empty message = "no more audio"; Soniox answers with the last tokens and "finished"
    finishing = { sock, timer: setTimeout(finishStop, 4000) };
    sock.onclose = finishStop;
    status("Finishing… / 終了処理中…", "#f0b400");
  } else {
    try { sock && sock.close(); } catch(e){}
    flushDisplay();
    status("Stopped / 停止中", "#666");
  }
}
$("forget").onclick = () => { try { localStorage.removeItem("si_key_" + $("prov").value); } catch(e){} $("key").value = ""; status("Key deleted from this browser / このブラウザからキーを削除しました", "#666"); };
$("start").onclick = () => start().catch(e => { if (!e.handled) notify("unknown", { msg: e.message }); stop(); });
$("src").value = "mic";   // iPad: microphone only
$("stop").onclick = stop;

// ---------- full screen / export ----------
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
$("full").onclick = () => {
  document.body.classList.add("full");
  const el = document.documentElement;
  try { (el.requestFullscreen || el.webkitRequestFullscreen).call(el); } catch(e) {}
  setTimeout(() => { applyUI(); flashExit(); }, 300);
};
// Hide menu (iPad / computer): same screen as normal, without the menus and without going full screen.
// (On the iPhone the "⛶ Hide menus" button already does this.)
function hideMenu(){ helpMenu(false); document.body.classList.add("hidemenu"); applyUI(); flashExit(); }
function showMenu(){ document.body.classList.remove("hidemenu", "showexit"); applyUI(); }
$("hidemenu").onclick = hideMenu;
$("showmenu").onclick = (e) => { e.stopPropagation(); showMenu(); };
let exitTimer = null;
function flashExit(){
  const b = document.body.classList;
  if (!b.contains("full") && !b.contains("hidemenu")) return;
  document.body.classList.add("showexit"); clearTimeout(exitTimer);
  exitTimer = setTimeout(() => document.body.classList.remove("showexit"), 3000);
}
function exitFull(){
  try { if (fsEl()) (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch(e) {}
  document.body.classList.remove("full", "showexit"); setTimeout(applyUI, 300);
}
$("exitfs").onclick = (e) => { e.stopPropagation(); exitFull(); };
for (const ev of ["mousemove","touchstart","click"]) document.addEventListener(ev, flashExit, { passive:true });
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (document.body.classList.contains("full")) exitFull(); else if (document.body.classList.contains("hidemenu")) showMenu();
});
document.addEventListener("dblclick", e => { if (document.body.classList.contains("full") && e.target.tagName !== "BUTTON") exitFull(); });
function onFs(){ if (!fsEl()) document.body.classList.remove("full", "showexit"); setTimeout(applyUI, 300); }
document.addEventListener("fullscreenchange", onFs); document.addEventListener("webkitfullscreenchange", onFs);
window.addEventListener("orientationchange", () => setTimeout(applyUI, 300));
$("export").onclick = () => {
  const txt = (TWO ? `TRANSLATION (${UP(SRC)} ⇄ ${UP(TGT)})` : `${UP(TGT)} (translation)`) + "\n=====\n" + log.join("\n") + "\n\n" + (TWO ? "SOURCE (as spoken)" : `${UP(SRC)} (source)`) + "\n=====\n" + jaLog;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([txt], {type:"text/plain"}));
  a.download = "seminar-transcript-" + new Date().toISOString().slice(0,10) + ".txt"; a.click();
};

listMics(); loadKey(); applyTheme();
// Keep the subtitles just below the menu, also when the menu changes height by itself
// (rotation, web font loaded, notices, glossary or iPhone Settings opened). Prevents text over the menu.
try { new ResizeObserver(() => applyUI()).observe($("controls")); } catch(e) {}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(applyUI);
</script>
